<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Location Finder</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>သင့်ရဲ့ တည်နေရာ အချက်အလက်</h2>
        <p id="info">တည်နေရာကို ရှာဖွေနေပါပြီ...</p>
    </div>

    <script>
        // အခမဲ့ IP API တစ်ခုကို အသုံးပြုခြင်း
        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(data => {
                const infoDiv = document.getElementById('info');
                infoDiv.innerHTML = `
                    <strong>IP Address:</strong> ${data.ip} <br>
                    <strong>မြို့ (City):</strong> ${data.city} <br>
                    <strong>ဒေသ/ပြည်နယ်:</strong> ${data.region} <br>
                    <strong>နိုင်ငံ:</strong> ${data.country_name} <br>
                    <strong>Postal Code:</strong> ${data.postal}
                `;
            })
            .catch(error => {
                document.getElementById('info').innerText = "တည်နေရာ အချက်အလက် ရယူ၍ မရပါ။";
            });
    </script>

</body>
</html>
